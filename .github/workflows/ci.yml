name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run python scripts/sync_spec.py --check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

  conformance:
    name: awp-demo against the suite (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [lockstep, streaming]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - name: run awp-conformance against the demo agent
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          uvx --prerelease allow --from awp-conformance==0.1.0a5 awp-conformance agent \
            --manifest conformance/manifest-${{ matrix.mode }}.json --frames conformance/frames.json \
            --mode ${{ matrix.mode }} --out report -- awp-demo --url '{url}' --token '{token}'
      - name: the claim is AWP-conformant
        run: |
          python3 -c "import json, sys; c = json.load(open('report/report.json'))['claim']; print(c['wording']); sys.exit(c['status'] != 'conformant')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.mode }}
          path: report/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uvx twine check dist/*
      - name: install the wheel in a clean environment
        run: |
          uv venv /tmp/wheel
          uv pip install --python /tmp/wheel dist/*.whl
          /tmp/wheel/bin/awp-demo --version
          /tmp/wheel/bin/python -c "import awp; print(awp.SPEC_REVISION)"
